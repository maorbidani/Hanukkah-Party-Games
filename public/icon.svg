    <circle cx="418" cy="108" r="6" />
    <circle cx="140" cy="76" r="4" />
    <circle cx="372" cy="82" r="4.5" />
  </g>

  <!-- Glowing Hanukkiah (left-center) -->
  <g transform="translate(216, 260)">
    <path d="M-56 120 L56 120 L32 94 L-32 94 Z" fill="url(#gold)" />
    <rect x="-10" y="-44" width="20" height="142" rx="6" fill="url(#gold)" />

    <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
      <path d="M0 54 Q-58 60 -106 -16" />
      <path d="M0 44 Q-44 48 -78 -16" />
      <path d="M0 32 Q-28 36 -50 -16" />
      <path d="M0 20 Q-14 24 -24 -16" />
      <path d="M0 20 Q14 24 24 -16" />
      <path d="M0 32 Q28 36 50 -16" />
      <path d="M0 44 Q44 48 78 -16" />
      <path d="M0 54 Q58 60 106 -16" />
    </g>

    <!-- 8 candles + tall Shamash -->
    <g>
      <rect x="-112" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
      <rect x="-84" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
      <rect x="-56" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
      <rect x="-30" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
      <rect x="-7" y="-82" width="14" height="52" rx="3" fill="#FEF08A" />
      <rect x="18" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
      <rect x="44" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
      <rect x="72" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
      <rect x="100" y="-56" width="12" height="42" rx="3" fill="#E0F2FE" />
    </g>

    <!-- Candle flames -->
    <g fill="#F97316">
      <path d="M-106 -60 Q-114 -74 -106 -90 Q-98 -74 -106 -60 Z" />
      <path d="M-78 -60 Q-86 -74 -78 -90 Q-70 -74 -78 -60 Z" />
      <path d="M-50 -60 Q-58 -74 -50 -90 Q-42 -74 -50 -60 Z" />
      <path d="M-24 -60 Q-32 -74 -24 -90 Q-16 -74 -24 -60 Z" />
      <path d="M0 -86 Q-10 -106 0 -126 Q10 -106 0 -86 Z" />
      <path d="M24 -60 Q16 -74 24 -90 Q32 -74 24 -60 Z" />
      <path d="M50 -60 Q42 -74 50 -90 Q58 -74 50 -60 Z" />
      <path d="M78 -60 Q70 -74 78 -90 Q86 -74 78 -60 Z" />
      <path d="M106 -60 Q98 -74 106 -90 Q114 -74 106 -60 Z" />
