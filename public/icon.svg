<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#09122C" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="dreidelBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <circle cx="240" cy="210" r="185" fill="url(#glow)" />

  <!-- Decorative festive stars -->
  <g fill="#FEF08A" opacity="0.9">
