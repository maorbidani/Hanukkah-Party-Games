      <circle cx="-78" cy="-70" r="3.5" />
      <circle cx="-50" cy="-70" r="3.5" />
      <circle cx="-24" cy="-70" r="3.5" />
      <circle cx="0" cy="-100" r="5" />
      <circle cx="24" cy="-70" r="3.5" />
      <circle cx="50" cy="-70" r="3.5" />
      <circle cx="78" cy="-70" r="3.5" />
      <circle cx="106" cy="-70" r="3.5" />
