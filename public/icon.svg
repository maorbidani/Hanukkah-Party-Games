  <!-- Colorful Dreidel (bottom-right foreground) -->
  <g transform="translate(384, 336) rotate(-10)">
    <rect x="-8" y="-66" width="16" height="26" rx="5" fill="url(#gold)" />
    <rect x="-38" y="-40" width="76" height="72" rx="12" fill="url(#dreidelBlue)" stroke="#FDE047" stroke-width="5" />
    <polygon points="-38,32 38,32 0,72" fill="url(#gold)" />
    <text x="0" y="10" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800" font-family="sans-serif">נ</text>
  </g>
